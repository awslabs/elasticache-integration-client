version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    groups:
      node-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /java
    schedule:
      interval: weekly
    groups:
      java-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
