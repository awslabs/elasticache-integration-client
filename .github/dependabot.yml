version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    # Photon is a library. Only raise a dependency's minimum version when the
    # new release is outside the current range, so consumers aren't forced to
    # upgrade. The lockfile still picks up new versions inside the range.
    versioning-strategy: increase-if-necessary
    groups:
      # vitest and @vitest/coverage-v8 must stay on the same version.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      node-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the oldest supported Node.js version (engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet. Remove this once it does.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: gradle
    directory: /java
    schedule:
      interval: weekly
    groups:
      java-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # JUnit 6 requires Java 17, and the tests run on Java 8.
      - dependency-name: org.junit.jupiter:junit-jupiter
        versions: [">=6"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    # Photon is a library. Only raise a dependency's minimum version when the
    # new release is outside the current range, so consumers aren't forced to
    # upgrade.
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
