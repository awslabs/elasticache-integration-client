name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: client
    attributes:
      label: Client
      multiple: true
      options:
        - Java
        - Python
        - Node.js
        - Go
        - All clients
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: The solution you'd like
      description: What you would like to happen, from your application's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
