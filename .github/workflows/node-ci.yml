name: Node.js CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (engines), current LTS, and current release.
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run check:idempotency
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            node/test-results.xml
            node/coverage/
          retention-days: 7
      - run: npm run pack:smoke
      # The tarball is the same on every Node.js version, so upload it once.
      - name: Upload package
        if: matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-node
          path: node/.artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
