name: Node.js CI

on:
  workflow_call:

permissions:
  contents: read

# CI steps don't run in a terminal. Force color instead of relying on each
# tool's CI detection.
env:
  FORCE_COLOR: "1"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (engines), current LTS, and current release.
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run check:idempotency
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The alignment tests run in alignment-ci.yml.
      - run: >-
          npm test --
          --exclude test/protocol-vectors.test.ts
          --exclude test/sdk-request-cases.test.ts
          --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            node/test-results.xml
            node/coverage/
          retention-days: 7
      - run: npm run pack:smoke
      # The tarball is the same on every Node.js version, so upload it once.
      - name: Upload package
        if: matrix.node-version == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-node
          path: node/.artifacts/*.tgz
          # upload-artifact skips files under dot directories like .artifacts by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
