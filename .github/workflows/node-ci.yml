name: Node.js CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (engines), current LTS, and current release.
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run check:idempotency
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            node/test-results.xml
            node/coverage/
          retention-days: 7
      - run: npm run pack:smoke
      # The tarball is the same on every Node.js version, so upload it once.
      - name: Upload package
        if: matrix.node-version == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-node
          path: node/.artifacts/*.tgz
          # upload-artifact skips files under dot directories like .artifacts by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
