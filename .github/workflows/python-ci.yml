name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "shared/idempotent-operations.json"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "shared/idempotent-operations.json"
      - ".github/workflows/python-ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The package lives in the python/ subdirectory.
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests with coverage
        run: python -m pytest
