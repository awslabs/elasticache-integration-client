name: Python CI

on:
  workflow_call:

# Least-privilege token: CI only needs to read the code.
permissions:
  contents: read

# CI steps don't run in a terminal, so tools print plain text unless told otherwise.
# FORCE_COLOR covers pip, ruff, and mypy; PY_COLORS covers pytest.
env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    # The package lives in the python/ subdirectory.
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      # The alignment tests run in alignment-ci.yml.
      - name: Run tests with coverage
        run: python -m pytest -m "not alignment" --cov-report=xml --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            python/test-results.xml
            python/coverage.xml
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      # The wheel is built from the sdist, so this also proves the sdist is self-contained.
      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Check archive contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          catalog = "elasticache_integrations/idempotent-operations.json"
          cache_modules = [
              "elasticache_integrations/__init__.py",
              "elasticache_integrations/client.py",
              "elasticache_integrations/session.py",
              "elasticache_integrations/connection.py",
              "elasticache_integrations/idempotency.py",
          ]
          # The toolkit is a PyPI dependency, so neither archive may carry a copy.
          junk = ("tests/", "build/", "dist/", "__pycache__/", ".pyc", "vendor/", "developer_toolkit_elasticache")

          (sdist,) = glob.glob("dist/*.tar.gz")
          (wheel,) = glob.glob("dist/*.whl")
          with tarfile.open(sdist) as archive:
              # Members start with "aws_elasticache_integration_client-<version>/"; drop that prefix.
              sdist_names = [n.split("/", 1)[1] for n in archive.getnames() if "/" in n]
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()

          errors = []
          required_by_archive = {
              "sdist": [catalog, *cache_modules],
              "wheel": [catalog, *cache_modules],
          }
          for label, names in (("sdist", sdist_names), ("wheel", wheel_names)):
              for required in required_by_archive[label]:
                  if required not in names:
                      errors.append(f"{label} is missing {required}")
              for name in names:
                  if any(part in name for part in junk):
                      errors.append(f"{label} contains {name}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("sdist and wheel contents ok")
          PY

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-python
          path: python/dist/
          if-no-files-found: error
          retention-days: 7
