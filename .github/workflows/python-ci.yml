name: Python CI

on:
  workflow_call:

# Least-privilege token: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    # The package lives in the python/ subdirectory.
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests with coverage
        run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      # The wheel is built from the sdist, so this also proves the sdist is self-contained.
      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Check archive contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          catalog = "photon/idempotent-operations.json"
          modules = [
              "photon/__init__.py",
              "photon/client.py",
              "photon/session.py",
              "photon/connection.py",
              "photon/idempotency.py",
          ]
          junk = ("tests/", "build/", "dist/", "__pycache__/", ".pyc")

          (sdist,) = glob.glob("dist/*.tar.gz")
          (wheel,) = glob.glob("dist/*.whl")
          with tarfile.open(sdist) as archive:
              # Members start with "photon-<version>/"; drop that prefix.
              sdist_names = [n.split("/", 1)[1] for n in archive.getnames() if "/" in n]
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()

          errors = []
          for label, names in (("sdist", sdist_names), ("wheel", wheel_names)):
              for required in [catalog, *modules]:
                  if required not in names:
                      errors.append(f"{label} is missing {required}")
              for name in names:
                  if any(part in name for part in junk):
                      errors.append(f"{label} contains {name}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("sdist and wheel contents ok")
          PY
