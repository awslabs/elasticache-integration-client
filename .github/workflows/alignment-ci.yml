name: Alignment CI

# Runs the cross-client tests that read shared/protocol-vectors.json and
# shared/sdk-request-cases.json, one job per client. The client workflows
# exclude these tests, so a failure here means a client drifted from the
# shared fixtures, not that its own suite broke. Local gates still run them.
on:
  workflow_call:
    inputs:
      python:
        type: boolean
        required: true
      java:
        type: boolean
        required: true
      node:
        type: boolean
        required: true
      dotnet:
        type: boolean
        # Optional, so callers that predate the .NET job stay valid.
        required: false
        default: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  python:
    if: inputs.python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run alignment tests
        run: python -m pytest -m alignment --no-cov

  java:
    if: inputs.java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: java
        run: chmod +x gradlew

      - name: Run alignment tests
        working-directory: java
        run: ./gradlew test --console=colored -PtestIncludeTags=alignment

  node:
    if: inputs.node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - name: Run alignment tests
        run: npx vitest run test/protocol-vectors.test.ts test/sdk-request-cases.test.ts

  dotnet:
    if: inputs.dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json
      - name: Run alignment tests
        run: >-
          dotnet test -c Release --filter Category=alignment
          -- RunConfiguration.TreatNoTestsAsError=true
