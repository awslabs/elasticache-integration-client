name: Java Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: java-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: corretto
          cache: gradle

      - name: Validate annotated tag and project version
        id: release
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "Release tags must be annotated: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          project_version="$(./gradlew --quiet printVersion)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Gradle version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: [8, 11, 17]

    steps:
      - name: Checkout release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: corretto
          cache: gradle

      - name: Build and test
        working-directory: java
        run: ./gradlew --no-daemon clean build

  build-artifacts:
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: corretto
          cache: gradle

      - name: Build unsigned release artifacts once
        working-directory: java
        run: ./gradlew --no-daemon -PreleasePublishing clean build publishToMavenLocal

      - name: Collect and validate artifacts
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$HOME/.m2/repository/software/amazon/photon/photon-java/$RELEASE_VERSION"
          artifact_dir="$PWD/build/release-artifacts"
          mkdir -p "$artifact_dir"
          find "$source_dir" -maxdepth 1 -type f \
            ! -name 'maven-metadata*' \
            -exec cp {} "$artifact_dir/" \;
          ./scripts/validate-release-artifacts.sh "$artifact_dir" "$RELEASE_VERSION"
          (
            cd "$artifact_dir"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Test clean Gradle and Maven consumers
        working-directory: java
        run: |
          ./scripts/consumer-smoke.sh \
            "file://$HOME/.m2/repository" \
            "$RELEASE_VERSION"

      - name: Upload immutable unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photon-java-${{ needs.validate-tag.outputs.version }}
          path: java/build/release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate-tag, build-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: corretto
          cache: gradle

      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: photon-java-${{ needs.validate-tag.outputs.version }}
          path: release-artifacts

      - name: Reproduce validated artifacts
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PreleasePublishing clean publishToMavenLocal
          source_dir="$HOME/.m2/repository/software/amazon/photon/photon-java/$RELEASE_VERSION"
          candidate_dir="$PWD/build/release-candidate"
          mkdir -p "$candidate_dir"
          find "$source_dir" -maxdepth 1 -type f \
            ! -name 'maven-metadata*' \
            -exec cp {} "$candidate_dir/" \;
          (
            cd "$candidate_dir"
            sha256sum --check "$GITHUB_WORKSPACE/release-artifacts/SHA256SUMS"
          )

      - name: Configure publication credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_PROJECT_mavenCentralUsername=$MAVEN_CENTRAL_USERNAME" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_mavenCentralPassword=$MAVEN_CENTRAL_PASSWORD" >> "$GITHUB_ENV"
          if [[ "$MAVEN_SIGNING_KEY" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            signing_key="$MAVEN_SIGNING_KEY"
          else
            signing_key="$(printf '%s' "$MAVEN_SIGNING_KEY" | base64 --decode)"
          fi
          delimiter="PHOTON_SIGNING_KEY_$(date +%s)_$RANDOM"
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<$delimiter"
            printf '%s\n' "$signing_key"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Sign and publish validated artifacts
        working-directory: java
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            -PreleasePublishing \
            -PreleaseSigning \
            publishAndReleaseToMavenCentral

      - name: Verify Maven Central publication
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          pom_url="https://repo1.maven.org/maven2/software/amazon/photon/photon-java/$RELEASE_VERSION/photon-java-$RELEASE_VERSION.pom"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --head "$pom_url" >/dev/null; then
              ./scripts/consumer-smoke.sh "https://repo1.maven.org/maven2" "$RELEASE_VERSION"
              exit 0
            fi
            echo "Waiting for Maven Central propagation ($attempt/60)"
            sleep 30
          done
          echo "Maven Central did not expose version $RELEASE_VERSION within 30 minutes" >&2
          exit 1

      - name: Create GitHub release and attach Java artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
