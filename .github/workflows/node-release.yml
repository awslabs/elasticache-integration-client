name: Node.js Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to validate without publishing (for example, 0.0.2-rc.1)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate source and tests
        run: npm run verify

  package:
    name: Build release tarball
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: node
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      dist-tag: ${{ steps.metadata.outputs.dist-tag }}
      package-name: ${{ steps.metadata.outputs.package-name }}
      should-publish: ${{ steps.release.outputs.should-publish }}
      tarball: ${{ steps.metadata.outputs.tarball }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Resolve release mode and version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node --input-type=commonjs -p "require('./package.json').version")"
          case "$EVENT_NAME" in
            push)
              if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                echo "Unsupported release tag: $RELEASE_TAG" >&2
                exit 1
              fi
              if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
                echo "Release tag must be annotated: $RELEASE_TAG" >&2
                exit 1
              fi
              version="${RELEASE_TAG#v}"
              should_publish="true"
              ;;
            workflow_dispatch)
              version="${INPUT_VERSION:-$package_version}"
              should_publish="false"
              echo "Manual dry run: validating $version without publishing"
              ;;
            *)
              echo "Unsupported workflow event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should-publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/set-package-version.mjs "$RELEASE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build and smoke test tarball
        run: npm run pack:smoke

      - name: Inspect package metadata
        run: |
          tarball="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npx --no-install publint "$tarball"
          npx --no-install attw "$tarball"

      - name: Record release metadata and checksum
        id: metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_name="$(node --input-type=commonjs -p "require('./package.json').name")"
          tarball_path="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          tarball="$(basename "$tarball_path")"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          (
            cd .artifacts
            shasum -a 256 "$tarball" > "$tarball.sha256"
          )
          echo "artifact-name=aws-elasticache-integration-client-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "package-name=$package_name" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            node/.artifacts/${{ steps.metadata.outputs.tarball }}
            node/.artifacts/${{ steps.metadata.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: package
    if: needs.package.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download validated tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: node/.artifacts

      - name: Verify artifact checksum
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          cd .artifacts
          shasum -a 256 -c "$TARBALL.sha256"

      - name: Verify npm publishing prerequisites
        env:
          MINIMUM_NODE_VERSION: "22.14.0"
          MINIMUM_NPM_VERSION: "11.5.1"
        run: |
          actual_node_version="$(node --version)"
          actual_npm_version="$(npm --version)"
          node -e "const parse = value => value.replace(/^v/, '').split('.').map(Number); const actual = parse(process.argv[1]); const minimum = parse(process.argv[2]); for (let index = 0; index < 3; index += 1) { if (actual[index] > minimum[index]) process.exit(0); if (actual[index] < minimum[index]) process.exit(1); }" "$actual_node_version" "$MINIMUM_NODE_VERSION"
          node -e "const parse = value => value.replace(/^v/, '').split('.').map(Number); const actual = parse(process.argv[1]); const minimum = parse(process.argv[2]); for (let index = 0; index < 3; index += 1) { if (actual[index] > minimum[index]) process.exit(0); if (actual[index] < minimum[index]) process.exit(1); }" "$actual_npm_version" "$MINIMUM_NPM_VERSION"

      - name: Publish validated tarball
        env:
          DIST_TAG: ${{ needs.package.outputs.dist-tag }}
          # TODO: After the first publication, configure npm trusted publishing,
          # revoke NPM_BOOTSTRAP_TOKEN, and remove this NODE_AUTH_TOKEN binding.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        # npm trusted publishing adds provenance automatically.
        run: npm publish ".artifacts/$TARBALL" --ignore-scripts --access public --tag "$DIST_TAG"

      - name: Wait for npm propagation
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.package-name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          for attempt in {1..20}; do
            published_version="$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version 2>/dev/null || true)"
            if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "$PACKAGE_NAME@$RELEASE_VERSION did not become available on npm" >&2
          exit 1

      - name: Smoke test published package
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.package-name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: node scripts/package-consumer-smoke.mjs "$PACKAGE_NAME@$RELEASE_VERSION" "$PACKAGE_NAME" "$RELEASE_VERSION"
