name: .NET CI

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -warnaserror --no-restore -c Release
      # The alignment tests run in alignment-ci.yml.
      - run: >-
          dotnet test --no-build -c Release --filter "Category!=alignment"
          --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-dotnet
          path: dotnet/TestResults/
          retention-days: 7
      - run: scripts/pack-smoke.sh --no-build
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dotnet
          path: |
            dotnet/artifacts/pack-smoke/*.nupkg
            dotnet/artifacts/pack-smoke/*.snupkg
          if-no-files-found: error
          retention-days: 7
      - name: Upload the built tests for the .NET 10 job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-net8.0-dotnet
          path: dotnet/test/Amazon.ElastiCache.Integrations.Tests/bin/Release/net8.0/
          if-no-files-found: error
          retention-days: 1

  # .NET 8 support ends 2026-11-10. Runs the net8.0 tests on an image that has only the .NET 10 runtime.
  net10-runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/dotnet/runtime:10.0
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-net8.0-dotnet
          path: tests
      - name: Test on .NET 10
        shell: bash
        working-directory: tests
        run: |
          dotnet --list-runtimes
          dotnet Amazon.ElastiCache.Integrations.Tests.dll -trait- Category=alignment | tee "$RUNNER_TEMP/run.log"
          grep -q '64-bit \.NET 10\.' "$RUNNER_TEMP/run.log"
