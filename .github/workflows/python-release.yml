name: Python CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_RELEASE_ARTIFACT: python-release-distributions

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      project-name: ${{ steps.version.outputs.project-name }}
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Validate annotated release tag and package version
        id: version
        shell: bash
        run: |
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release tags must be annotated."
            exit 1
          fi

          version="$(python scripts/release.py version --tag "${GITHUB_REF_NAME}")"
          project_name="$(python scripts/release.py project-name)"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "project-name=${project_name}" >>"${GITHUB_OUTPUT}"

      - name: Install release build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution once
        run: python -m build --outdir release/dist

      - name: Validate distribution metadata
        run: python -m twine check release/dist/*

      - name: Inspect contents and record checksums
        run: |
          python scripts/release.py inspect \
            --dist-dir release/dist \
            --expected-version "${{ steps.version.outputs.version }}" \
            --checksums release/python-SHA256SUMS

      - name: Upload immutable release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PYTHON_RELEASE_ARTIFACT }}
          path: python/release/
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Run the complete test suite
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest

      - name: Download the distributions built by the release job
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ env.PYTHON_RELEASE_ARTIFACT }}
          path: python/release

      - name: Install and smoke test the exact wheel
        shell: bash
        run: |
          smoke_env="${RUNNER_TEMP}/photon-wheel-smoke"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install --upgrade pip
          "${smoke_env}/bin/python" -m pip install python/release/dist/*.whl
          "${smoke_env}/bin/python" python/scripts/release.py smoke \
            --expected-version "${{ needs.build.outputs.version }}"

  publish:
    name: Publish to PyPI
    needs: [build, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/${{ needs.build.outputs.project-name }}/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ env.PYTHON_RELEASE_ARTIFACT }}
          path: release

      - name: Publish the exact validated distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist
          attestations: true

  verify:
    name: Verify PyPI publication
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release smoke test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Wait for PyPI and smoke test the published version
        shell: bash
        run: |
          smoke_env="${RUNNER_TEMP}/photon-pypi-smoke"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install --upgrade pip

          for attempt in {1..20}; do
            if "${smoke_env}/bin/python" -m pip install \
              "${{ needs.build.outputs.project-name }}==${{ needs.build.outputs.version }}"; then
              break
            fi
            if [[ "${attempt}" == "20" ]]; then
              echo "::error::The published version did not become installable from PyPI."
              exit 1
            fi
            sleep 30
          done

          "${smoke_env}/bin/python" python/scripts/release.py smoke \
            --expected-version "${{ needs.build.outputs.version }}"

  github-release:
    name: Attach Python artifacts to GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the published distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ env.PYTHON_RELEASE_ARTIFACT }}
          path: release

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if ! gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes; then
              gh release view "${GITHUB_REF_NAME}" >/dev/null
            fi
          fi

          gh release upload "${GITHUB_REF_NAME}" \
            release/python-SHA256SUMS \
            release/dist/* \
            --clobber
