name: Java CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # The JDK the tests run on. Every job also installs JDK 21 to run Gradle
        # (compile, Error Prone, Spotless), which still emits Java 8 bytecode.
        java-version: [8, 11, 17, 21]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      # Install the matrix JDK for the tests and JDK 21 for Gradle. The last entry
      # becomes JAVA_HOME, which Gradle runs on. setup-java also exports
      # JAVA_HOME_<major>_X64, which the test toolchain uses to find the matrix JDK.
      - name: Set up JDK ${{ matrix.java-version }} and JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: |
            ${{ matrix.java-version }}
            21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: java
        run: chmod +x gradlew

      - name: Build and test on Java ${{ matrix.java-version }}
        working-directory: java
        run: >-
          ./gradlew build
          -PtestJavaVersion=${{ matrix.java-version }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java-version }}_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            java/build/reports/tests/test/
            java/build/reports/jacoco/test/
          retention-days: 7

      # Gradle runs on JDK 21 in every job, so the JARs are the same; upload them once.
      - name: Upload JARs
        if: matrix.java-version == 21
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-java
          path: java/build/libs/
          if-no-files-found: error
          retention-days: 7
