name: Java CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Test JDK. Gradle, Error Prone, and Spotless always run on JDK 21.
        java-version: [8, 11, 17, 21]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      # The last java-version entry becomes JAVA_HOME, so Gradle runs on JDK 21.
      # setup-java also exports JAVA_HOME_<major>_X64 for the test toolchain.
      - name: Set up JDK ${{ matrix.java-version }} and JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: |
            ${{ matrix.java-version }}
            21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: java
        run: chmod +x gradlew

      - name: Build and test on Java ${{ matrix.java-version }}
        working-directory: java
        run: >-
          ./gradlew build
          -PtestJavaVersion=${{ matrix.java-version }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java-version }}_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            java/build/reports/tests/test/
            java/build/reports/jacoco/test/
          retention-days: 7
