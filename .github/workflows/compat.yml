name: Compatibility

# Slower checks that don't need to run on every pull request: the full Python
# matrix, a clean wheel install, and the oldest and newest AWS SDK versions each
# client allows. Not part of the required `ci` check.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version from the minimum (requires-python) to the newest. pip
        # installs the newest boto3 and botocore the version ranges allow.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest

  python-minimum-sdk:
    name: python (minimum boto3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install package with the oldest allowed boto3 and botocore
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          # Turn "boto3>=1.34,<2" in pyproject.toml into "boto3==1.34".
          mapfile -t pins < <(sed -nE 's/^ *"(boto3|botocore)>=([0-9.]+).*/\1==\2/p' pyproject.toml)
          test "${#pins[@]}" -eq 2
          echo "${pins[@]}"
          pip install "${pins[@]}"
          pip show boto3 botocore | grep -E '^(Name|Version)'

      - name: Run tests
        run: python -m pytest

  python-wheel:
    name: python (clean wheel install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Install into a fresh virtual environment and import from outside the
      # checkout, so the test can't pick up the source tree.
      - name: Install the wheel and import it
        working-directory: ${{ runner.temp }}
        env:
          WHEEL_DIR: ${{ github.workspace }}/python/dist
        run: |
          python -m venv consumer
          consumer/bin/pip install "$WHEEL_DIR"/*.whl
          consumer/bin/python - <<'PY'
          from importlib.resources import files

          import photon

          for name in ("client", "PhotonCacheUnavailable", "PhotonConfigError", "PhotonError"):
              assert hasattr(photon, name), name
          assert files("photon").joinpath("idempotent-operations.json").is_file()
          print("wheel import ok:", photon.__file__)
          PY

  node-latest:
    name: node (latest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Consumers don't get this package's lockfile, so resolve every dependency
      # to the newest version its range allows.
      - name: Install without the lockfile
        run: |
          rm package-lock.json
          npm install --no-audit --no-fund
          npm ls --depth=0

      # The full local gate. It type-checks against the newest SDK declarations,
      # and its package smoke test installs the tarball the way a consumer does.
      - name: Verify
        run: npm run verify

  node-minimum-sdk:
    name: node (minimum AWS SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the oldest allowed AWS SDK and Smithy packages
        run: |
          npm ci
          # Turn each "^x.y.z" range for @aws-sdk/* and @smithy/* into "x.y.z".
          # Fail on any other range format so no dependency drops out silently.
          node -e '
            const deps = require("./package.json").dependencies;
            const sdk = Object.entries(deps).filter(([name]) => /^@(aws-sdk|smithy)\//.test(name));
            if (sdk.length === 0) throw new Error("no @aws-sdk/* or @smithy/* dependencies found");
            for (const [name, range] of sdk) {
              const match = /^\^(\d+\.\d+\.\d+)$/.exec(range);
              if (!match) throw new Error(name + ": expected a \"^x.y.z\" range, got \"" + range + "\"");
              console.log(name + "@" + match[1]);
            }' > "$RUNNER_TEMP/sdk-pins.txt"
          mapfile -t pins < "$RUNNER_TEMP/sdk-pins.txt"
          echo "${pins[@]}"
          npm install --no-save --no-audit --no-fund --ignore-scripts "${pins[@]}"
          npm ls --depth=0

      # Not `npm run verify`: its package smoke test reinstalls the newest SDK,
      # so it wouldn't test the minimum versions.
      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  java-latest-sdk:
    name: java (${{ matrix.java-version }}, latest AWS SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: [8, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Same setup as java-ci.yml: the matrix JDK runs the tests, JDK 21 runs Gradle.
      - name: Set up JDK ${{ matrix.java-version }} and JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: |
            ${{ matrix.java-version }}
            21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Test against the newest AWS SDK 2.x
        working-directory: java
        run: >-
          ./gradlew test
          -PawsSdkVersion=2.+
          -PtestJavaVersion=${{ matrix.java-version }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java-version }}_X64
          -Porg.gradle.java.installations.auto-download=false
