name: Compatibility

# Slower checks that don't need to run on every pull request: the full Python
# matrix, a clean wheel install, and the oldest and newest AWS SDK versions each
# client allows. Not part of the required `ci` check.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version from the minimum (requires-python) to the newest. pip
        # installs the newest boto3 and botocore the version ranges allow.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest

  python-minimum-sdk:
    name: python (minimum boto3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install package with the oldest allowed boto3 and botocore
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          # Turn "boto3>=1.34,<2" in pyproject.toml into "boto3==1.34".
          mapfile -t pins < <(sed -nE 's/^ *"(boto3|botocore)>=([0-9.]+).*/\1==\2/p' pyproject.toml)
          test "${#pins[@]}" -eq 2
          echo "${pins[@]}"
          pip install "${pins[@]}"
          pip show boto3 botocore | grep -E '^(Name|Version)'

      - name: Run tests
        run: python -m pytest

  python-wheel:
    name: python (clean wheel install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Install into a fresh virtual environment and import from outside the
      # checkout, so the test can't pick up the source tree.
      - name: Install the wheel and import it
        working-directory: ${{ runner.temp }}
        env:
          WHEEL_DIR: ${{ github.workspace }}/python/dist
        run: |
          python -m venv consumer
          consumer/bin/pip install "$WHEEL_DIR"/*.whl
          consumer/bin/python - <<'PY'
          from importlib.resources import files

          import photon

          for name in ("client", "PhotonCacheUnavailable", "PhotonConfigError", "PhotonError"):
              assert hasattr(photon, name), name
          assert files("photon").joinpath("idempotent-operations.json").is_file()
          print("wheel import ok:", photon.__file__)
          PY

  node-latest:
    name: node (latest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Consumers don't get this package's lockfile, so resolve every dependency
      # to the newest version its range allows.
      - name: Install without the lockfile
        run: |
          rm package-lock.json
          npm install --no-audit --no-fund
          npm ls --depth=0

      - name: Run tests
        run: npm test

  node-minimum-sdk:
    name: node (minimum AWS SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the oldest allowed AWS SDK and Smithy packages
        run: |
          npm ci
          # Turn each "^x.y.z" range for @aws-sdk/* and @smithy/* into "x.y.z".
          mapfile -t pins < <(node -e '
            const deps = require("./package.json").dependencies;
            for (const [name, range] of Object.entries(deps)) {
              if (/^@(aws-sdk|smithy)\//.test(name) && range.startsWith("^")) {
                console.log(name + "@" + range.slice(1));
              }
            }')
          test "${#pins[@]}" -gt 0
          echo "${pins[@]}"
          npm install --no-save --no-audit --no-fund --ignore-scripts "${pins[@]}"
          npm ls --depth=0

      - name: Run tests
        run: npm test

  java-latest-sdk:
    name: java (${{ matrix.java-version }}, latest AWS SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: [8, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      # Same setup as java-ci.yml: the matrix JDK runs the tests, JDK 21 runs Gradle.
      - name: Set up JDK ${{ matrix.java-version }} and JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: |
            ${{ matrix.java-version }}
            21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Test against the newest AWS SDK 2.x
        working-directory: java
        run: >-
          ./gradlew test
          -PawsSdkVersion=2.+
          -PtestJavaVersion=${{ matrix.java-version }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java-version }}_X64
          -Porg.gradle.java.installations.auto-download=false
