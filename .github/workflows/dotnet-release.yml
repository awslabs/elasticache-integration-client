name: .NET Release

# Publishing to nuget.org also needs the repository variable
# DOTNET_NUGET_PUBLISH set to "true". Without it, a release tag (shared by all
# clients) validates the csproj version: it runs every check and builds the
# package, then skips publish, verify and github-release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      should-publish: ${{ steps.release.outputs.should-publish }}
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Resolve release mode and version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISH_ENABLED: ${{ vars.DOTNET_NUGET_PUBLISH == 'true' }}
        run: |
          package_version="$(dotnet msbuild src/Amazon.ElastiCache.Integrations -getProperty:Version)"
          case "$EVENT_NAME" in
            push)
              if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                echo "Unsupported release tag: $RELEASE_TAG" >&2
                exit 1
              fi
              if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
                echo "Release tag must be annotated: $RELEASE_TAG" >&2
                exit 1
              fi
              version="${RELEASE_TAG#v}"
              if [[ "$PUBLISH_ENABLED" != "true" ]]; then
                if [[ "$version" != "$package_version" ]]; then
                  echo "::warning::Tag version $version does not match the csproj version $package_version"
                fi
                version="$package_version"
                should_publish="false"
                echo "::notice::DOTNET_NUGET_PUBLISH is not 'true': validating $version without publishing"
              elif [[ "$version" != "$package_version" ]]; then
                echo "Tag version $version does not match the csproj version $package_version" >&2
                exit 1
              else
                should_publish="true"
              fi
              ;;
            workflow_dispatch)
              version="$package_version"
              should_publish="false"
              echo "Manual dry run: validating $version without publishing"
              ;;
            *)
              echo "Unsupported workflow event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "should-publish=$should_publish"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-release
    uses: ./.github/workflows/dotnet-ci.yml

  # dotnet-ci.yml excludes the cross-client alignment tests, so run them here.
  alignment:
    needs: resolve-release
    uses: ./.github/workflows/alignment-ci.yml
    with:
      python: false
      java: false
      node: false
      dotnet: true

  package:
    name: Build release package
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json

      # Packs once and smoke tests that package; the same files are published.
      - name: Build and smoke test the package
        run: scripts/pack-smoke.sh

      - name: Record release metadata and checksums
        id: metadata
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          mkdir release
          cp "artifacts/pack-smoke/Amazon.ElastiCache.Integrations.$RELEASE_VERSION.nupkg" \
            "artifacts/pack-smoke/Amazon.ElastiCache.Integrations.$RELEASE_VERSION.snupkg" release/
          (cd release && sha256sum -- *.nupkg *.snupkg > dotnet-SHA256SUMS)
          echo "artifact-name=elasticache-integrations-dotnet-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: dotnet/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to nuget.org
    needs: [resolve-release, test, alignment, package]
    if: needs.resolve-release.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.nuget.org/packages/Amazon.ElastiCache.Integrations/${{ needs.resolve-release.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release

      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum -c dotnet-SHA256SUMS

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived API key.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg next to the .nupkg as well. A re-run skips files
      # nuget.org already has; verify then checks the published package.
      - name: Publish the validated package
        working-directory: release
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: >-
          dotnet nuget push "Amazon.ElastiCache.Integrations.$RELEASE_VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  verify:
    name: Verify the nuget.org publication
    needs: [resolve-release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
          cache: true
          cache-dependency-path: dotnet/**/packages.lock.json

      - name: Wait for nuget.org and smoke test the published package
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          # The flat container lists lower-case versions.
          index="https://api.nuget.org/v3-flatcontainer/amazon.elasticache.integrations/index.json"
          expected="${RELEASE_VERSION,,}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$index" | jq -e --arg v "$expected" '.versions | index($v)' >/dev/null; then
              scripts/pack-smoke.sh --published
              exit 0
            fi
            echo "Waiting for nuget.org propagation ($attempt/60)"
            sleep 30
          done
          echo "nuget.org did not list version $RELEASE_VERSION within 30 minutes" >&2
          exit 1

  github-release:
    name: Attach .NET artifacts to the GitHub release
    needs: [package, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the published package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
