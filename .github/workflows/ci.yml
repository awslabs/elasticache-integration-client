name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which clients a pull request touches. Pushes and manual runs test
  # every client. Skipped client jobs still report through the `ci` job below,
  # so branch protection only needs to require that one check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent (the base).
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed clients
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            for client in python java node; do
              echo "$client=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"

          # Shared contracts and this workflow affect every client.
          shared='^(shared/|\.github/workflows/ci\.yml$)'
          for client in python java node; do
            if echo "$changed" | grep -Eq "$shared|^$client/|^\.github/workflows/$client-ci\.yml$"; then
              echo "$client=true" >> "$GITHUB_OUTPUT"
            else
              echo "$client=false" >> "$GITHUB_OUTPUT"
            fi
          done

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/python-ci.yml

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    uses: ./.github/workflows/java-ci.yml

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    uses: ./.github/workflows/node-ci.yml

  # Stable aggregate check for branch protection.
  ci:
    if: always()
    needs: [changes, python, java, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check client results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A required CI job finished with result '$result'"
                exit 1
                ;;
            esac
          done
