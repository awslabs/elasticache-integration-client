name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which clients a pull request touches. Pushes and manual runs test
  # every client. Skipped client jobs still report through the `ci` job below,
  # so branch protection only needs to require that one check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent (the base).
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed clients
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            for client in python java node; do
              echo "$client=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"

          # Shared contracts, this workflow, and the alignment workflow affect
          # every client.
          shared='^(shared/|\.github/workflows/(ci|alignment-ci)\.yml$)'
          for client in python java node; do
            if echo "$changed" | grep -Eq \
              "$shared|^$client/|^\.github/workflows/$client-(ci|release)\.yml$"; then
              echo "$client=true" >> "$GITHUB_OUTPUT"
            else
              echo "$client=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # Report when a tracked file uses an internal term. The patterns come from the
  # DENYLIST repository secret, so they stay out of the public repository. Fork
  # pull requests get no secrets, so this job skips them. The push to main still
  # checks merged content. The ci aggregate job does not need this job, so a
  # failed run does not block merge.
  denylist:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for denylisted terms
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        # The patterns reach the script through a pipe, so they never touch disk.
        run: |
          printf '%s\n' "$DENYLIST" | scripts/check-denylist.sh

  # Fail when a tracked source file has no license header. It needs no secrets,
  # so it runs on every pull request, forks included. The ci aggregate job needs
  # it, so a missing header blocks merge.
  license-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license headers
        run: scripts/check-license-headers.sh

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/python-ci.yml

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    uses: ./.github/workflows/java-ci.yml

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    uses: ./.github/workflows/node-ci.yml

  # Cross-client alignment tests, one job per changed client. The client
  # workflows above exclude them.
  alignment:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.java == 'true' ||
      needs.changes.outputs.node == 'true'
    uses: ./.github/workflows/alignment-ci.yml
    with:
      python: ${{ needs.changes.outputs.python == 'true' }}
      java: ${{ needs.changes.outputs.java == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' }}

  # GitHub can't read Gradle dependencies from build.gradle.kts, so submit the
  # resolved graph. Dependabot alerts use the graph from main, and dependency
  # review compares the pull request's graph against it. The job only resolves
  # dependencies; it doesn't build or change anything.
  java-dependency-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: java

  # Fail pull requests that add a dependency with a known high or critical
  # vulnerability. Dependabot alerts still report lower severities.
  dependency-review:
    if: github.event_name == 'pull_request'
    needs: java-dependency-graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # GitHub processes the submitted Gradle graph asynchronously.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

  # Stable aggregate check for branch protection.
  ci:
    if: always()
    needs: [changes, license-headers, python, java, node, alignment, java-dependency-graph, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check client results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A required CI job finished with result '$result'"
                exit 1
                ;;
            esac
          done
