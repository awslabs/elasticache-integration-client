[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticache-integrations"
version = "0.0.1"
description = "ElastiCacheIntegrations client — read-through/write-through caching for AWS SDK calls via an ElastiCache Serverless cache."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.43,<2",
    "botocore>=1.43,<2",
    "cel-python>=0.1",  # CEL evaluation of the resolved aws.config predicates
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "cryptography>=42",  # used by tests/mock.py to mint a self-signed cert for the TLS e2e
    "packaging>=24",
]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "build==1.6.1",
    "twine==7.0.0",
]

[tool.setuptools.packages.find]
where = [".", "vendor/developer-toolkit-elasticache/python/src"]
include = ["elasticache_integrations*", "developer_toolkit_elasticache*"]

[tool.setuptools.package-data]
developer_toolkit_elasticache = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--cov=elasticache_integrations --cov-report=term-missing"
markers = [
    "alignment: cross-client tests that run the shared/ fixtures; CI runs them in the alignment job",
]

[tool.coverage.run]
source = ["elasticache_integrations"]
branch = true

[tool.coverage.report]
show_missing = true
# Rounded down to the nearest 5 from the 2026-10-01 baseline (94.3% to 94.7% combined
# line and branch across runs).
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["elasticache_integrations"]

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "celpy",
    "celpy.*",
    "developer_toolkit_elasticache",
    "developer_toolkit_elasticache.*",
    "urllib3",
    "urllib3.*",
]
ignore_missing_imports = true
