[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-elasticache-integration-client"
version = "0.0.1"
description = "ElastiCache Integrations for AWS SDK for Python (Boto3) DynamoDB clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.43,<2",
    "botocore>=1.43,<2",
    "cel-python>=0.1",  # CEL evaluation of the resolved aws.config predicates
    "developer-toolkit-elasticache>=1.1,<2",  # IAM token generation and refresh
]

[project.urls]
Repository = "https://github.com/awslabs/aws-elasticache-integration-client"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "cryptography>=42",  # used by tests/mock.py to mint a self-signed cert for the TLS e2e
    "packaging>=24",
]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "build==1.6.1",
    "twine==7.0.0",
]

[tool.setuptools.packages.find]
include = ["aws_elasticache_integration_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--cov=aws_elasticache_integration_client --cov-report=term-missing"
markers = [
    "alignment: cross-client tests that run the shared/ fixtures; CI runs them in the alignment job",
]

[tool.coverage.run]
source = ["aws_elasticache_integration_client"]
branch = true

[tool.coverage.report]
show_missing = true
# Rounded down to the nearest 5 from the 2026-10-01 baseline (94.3% to 94.7% combined
# line and branch across runs).
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["aws_elasticache_integration_client"]

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "celpy",
    "celpy.*",
    "urllib3",
    "urllib3.*",
]
ignore_missing_imports = true
